name: one-time-arbitrage-gas-fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'arbitrage gas fix') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch arbitrage gas estimation
        shell: python
        run: |
          from pathlib import Path

          p = Path("src/lst-arbitrage.ts")
          s = p.read_text()

          marker = "export async function preflightAllLSTArbitrage("
          helper = r'''
          async function rpcBatch(rpcUrl: string, requests: Array<{ method: string; params: unknown[] }>): Promise<any[]> {
            if (!requests.length) return [];
            const payload = requests.map((request, index) => ({
              jsonrpc: "2.0",
              id: index + 1,
              method: request.method,
              params: request.params
            }));
            const response = await fetch(rpcUrl, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify(payload)
            });
            const body = await response.json().catch(() => []);
            if (!response.ok) throw new Error("RPC batch HTTP " + response.status);
            if (!Array.isArray(body)) throw new Error("RPC batch returned a non-array response");
            return body;
          }

          async function estimateGasBatch(
            rpcUrl: string,
            transactions: any[]
          ): Promise<Array<{ gas: bigint | null; error?: string }>> {
            if (!transactions.length) return [];
            try {
              const responses = await rpcBatch(
                rpcUrl,
                transactions.map(tx => ({
                  method: "eth_estimateGas",
                  params: [{
                    from: tx.from,
                    to: tx.to,
                    value: tx.value,
                    data: tx.input
                  }, "latest"]
                }))
              );
              return transactions.map((_, index) => {
                const response = responses.find(item => Number(item?.id) === index + 1);
                if (response?.result) {
                  try {
                    return { gas: BigInt(String(response.result)) };
                  } catch {}
                }
                return {
                  gas: null,
                  error: String(response?.error?.message ?? "eth_estimateGas unavailable")
                };
              });
            } catch (error) {
              const message = error instanceof Error ? error.message : String(error);
              return transactions.map(() => ({ gas: null, error: message }));
            }
          }

          '''
          if "async function estimateGasBatch(" not in s:
              if marker not in s:
                  raise SystemExit("preflightAllLSTArbitrage marker not found")
              s = s.replace(marker, helper + marker, 1)

          old = '''    const gasPriceRaw = await rpcJson(rpcUrl, "eth_gasPrice").catch(() => "0x0");
    const gasPrice = BigInt(String(gasPriceRaw));

    for (let index = 0; index < prepared.length; index++) {
      const item = prepared[index];
      const calls = Array.isArray(simulatedBlocks[index]?.calls)
        ? simulatedBlocks[index].calls
        : [];
      const simulatedResults = calls.map((call: any) => ({
        ok: String(call?.status ?? "0x0") === "0x1",
        status: String(call?.status ?? ""),
        gasUsed: call?.gasUsed ? String(call.gasUsed) : null,
        returnData: String(call?.returnData ?? ""),
        error: call?.error ?? null
      }));
      const successful =
        simulatedResults.length === item.transactions.length &&
        simulatedResults.every((entry: any) => entry.ok === true);
      const gasUnits = simulatedResults.reduce(
        (sum: bigint, entry: any) =>
          sum + (entry?.gasUsed ? BigInt(entry.gasUsed) : 0n),
        0n
      );
      const gasCostMon =
        gasUnits > 0n ? Number(gasUnits * gasPrice) / 1e18 : null;

      results.push({
        route: item.route.path,
        ok: true,
        quoteOnly: false,
        sizeMon,
        quotedFinalMon: item.quote.finalMon,
        quotedGrossProfitMon: item.quote.grossProfitMon,
        quotedNetProfitMon: item.quote.netProfitMon,
        gasUnits: gasUnits.toString(),
        gasPriceRaw: gasPrice.toString(),
        gasCostMon,
        candidate:
          successful &&
          item.quote.candidate === true &&
          gasCostMon !== null &&
          item.quote.finalMon - sizeMon - gasCostMon - GAS_BUFFER_MON >= MIN_NET_PROFIT_MON,
        transactionCount: item.transactions.length,
        transactions: item.transactions,
        simulation: {
          method: "eth_simulateV1",
          blockNumber,
          successful,
          results: simulatedResults,
          error: simulationError
        },
        legResults: item.legResults
      });
    }'''
          new = '''    const gasPriceRaw = await rpcJson(rpcUrl, "eth_gasPrice").catch(() => "0x0");
    const gasPrice = BigInt(String(gasPriceRaw));

    // eth_estimateGas is batched into a single RPC request. It is used as an
    // independent sanity check against eth_simulateV1's per-call gasUsed.
    // Profitability uses the conservative maximum of the two values, so the
    // simulation gas ceiling can never masquerade as a cheap estimate and a
    // failed estimator can never silently produce a zero gas cost.
    const gasEstimatesByRoute = await Promise.all(
      prepared.map(item => estimateGasBatch(rpcUrl, item.transactions))
    );

    for (let index = 0; index < prepared.length; index++) {
      const item = prepared[index];
      const calls = Array.isArray(simulatedBlocks[index]?.calls)
        ? simulatedBlocks[index].calls
        : [];
      const simulatedResults = calls.map((call: any) => ({
        ok: String(call?.status ?? "0x0") === "0x1",
        status: String(call?.status ?? ""),
        gasUsed: call?.gasUsed ? String(call.gasUsed) : null,
        returnData: String(call?.returnData ?? ""),
        error: call?.error ?? null
      }));
      const successful =
        simulatedResults.length === item.transactions.length &&
        simulatedResults.every((entry: any) => entry.ok === true);

      const estimates = gasEstimatesByRoute[index] ?? [];
      const gasByTx = item.transactions.map((_, txIndex) => {
        const simulatedGas = simulatedResults[txIndex]?.gasUsed
          ? BigInt(simulatedResults[txIndex].gasUsed)
          : 0n;
        const estimatedGas = estimates[txIndex]?.gas ?? 0n;
        return {
          simulatedGas,
          estimatedGas,
          effectiveGas: estimatedGas > simulatedGas ? estimatedGas : simulatedGas,
          source:
            estimates[txIndex]?.gas !== null &&
            estimates[txIndex]?.gas !== undefined
              ? "max(eth_estimateGas,eth_simulateV1.gasUsed)"
              : simulatedGas > 0n
                ? "eth_simulateV1.gasUsed:fallback"
                : "unavailable"
        };
      });

      const gasUnits = gasByTx.reduce(
        (sum: bigint, entry: any) => sum + entry.effectiveGas,
        0n
      );
      const gasCostMon =
        gasUnits > 0n ? Number(gasUnits * gasPrice) / 1e18 : null;
      const allGasEstimated = estimates.length === item.transactions.length &&
        estimates.every((entry: any) => entry?.gas !== null && entry?.gas !== undefined);
      const gasSource = allGasEstimated
        ? "max(eth_estimateGas,eth_simulateV1.gasUsed)"
        : gasUnits > 0n
          ? "mixed:eth_estimateGas+eth_simulateV1.gasUsed"
          : "unavailable";

      results.push({
        route: item.route.path,
        ok: true,
        quoteOnly: false,
        sizeMon,
        quotedFinalMon: item.quote.finalMon,
        quotedGrossProfitMon: item.quote.grossProfitMon,
        quotedNetProfitMon: item.quote.netProfitMon,
        gasUnits: gasUnits.toString(),
        gasPriceRaw: gasPrice.toString(),
        gasCostMon,
        gasSource,
        gasByTransaction: gasByTx.map((entry: any, txIndex: number) => ({
          transactionIndex: txIndex,
          simulatedGas: entry.simulatedGas.toString(),
          estimatedGas: estimates[txIndex]?.gas?.toString() ?? null,
          effectiveGas: entry.effectiveGas.toString(),
          estimateError: estimates[txIndex]?.error ?? null,
          source: entry.source
        })),
        candidate:
          successful &&
          item.quote.candidate === true &&
          gasCostMon !== null &&
          item.quote.finalMon - sizeMon - gasCostMon - GAS_BUFFER_MON >= MIN_NET_PROFIT_MON,
        transactionCount: item.transactions.length,
        transactions: item.transactions,
        simulation: {
          method: "eth_simulateV1",
          blockNumber,
          successful,
          results: simulatedResults,
          error: simulationError
        },
        gasEstimation: {
          method: "eth_estimateGas",
          batched: true,
          authoritativeForProfitability: true,
          conservativeRule: "effectiveGas=max(eth_estimateGas,simulation.gasUsed)"
        },
        legResults: item.legResults
      });
    }'''

          if old not in s:
              raise SystemExit("gas calculation block not found; refusing unsafe partial patch")
          s = s.replace(old, new, 1)

          # Make the one-time revision explicit.
          s = s.replace(
              'const LST_ARBITRAGE_BUILD_REVISION = "arb-universal-token-discovery-v22-nadfun-dexscreen-frontier-2026-10-05";',
              'const LST_ARBITRAGE_BUILD_REVISION = "arb-universal-token-discovery-v23-batched-estimate-gas-2026-10-06";',
              1
          )

          p.write_text(s)

      - name: Typecheck and tests
        run: |
          npm ci
          npx tsc --noEmit
          npm test -- --runInBand

      - name: Commit patch
        run: |
          git config user.name "GELD automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/lst-arbitrage.ts
          git commit -m "fix: arbitrage gas estimation" || exit 0
          git push
